services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: college_admission_db
      POSTGRES_USER: college_admission_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - college_admission_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U college_admission_user -d college_admission_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
  web:
    build: .
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py seed_data && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DATABASE_URL: postgresql://college_admission_user:${POSTGRES_PASSWORD}@postgres:5432/college_admission_db
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DB_SSL_REQUIRED: "False"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
volumes:
  college_admission_postgres:
