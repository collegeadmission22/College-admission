<input type="hidden" name="lead_source" value="{{ lead_source|default:'Website' }}">
<div class="apply-row"><label>Student Name{{ apply_form.name }}</label><label>Father Name{{ apply_form.father_name }}</label></div>
<div class="apply-row"><label>Mobile Number{{ apply_form.phone }}</label><label>Email{{ apply_form.email }}</label></div>
<div class="apply-row"><label>City{{ apply_form.city }}</label><label>Course{{ apply_form.course }}</label></div>
<div class="apply-row"><label>College{{ apply_form.preferred_college }}</label><label>Distance / Online Education{{ apply_form.preferred_distance_online }}</label></div>
<label class="consent-check"><input type="checkbox" name="consent" required> I agree to be contacted by phone, WhatsApp, SMS or email for counselling and admission assistance.</label>
<button class="primary">Get Free Counselling</button>
